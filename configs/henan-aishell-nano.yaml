# Fun-ASR-Nano-2512 MLX LoRA · 河南+AISHELL(asr-mix, 与 qwen3-asr-ft 会话同数据同测试集)
name: "henan-aishell"
output_dir: "outputs/lora-nano"

model_config:
  base_dir: "weights/fun-asr-nano-mlx/fp16"

data_config:
  # build_mix_dataset.py 产物: 河南 490,163 + aishell 122,540 = 612,703 条
  data_file: "/Users/Apple/datasets/asr-mix/train/metadata.jsonl"

lora_config:
  r: 16
  lora_alpha: 32          # 官方 Nano LoRA 默认(scale=2)
  dropout: 0.05
  target_modules: ["q_proj", "v_proj"]

training_args:
  learning_rate: 1.0e-4   # 官方 Nano LoRA 档(qwen3-asr 用的 1e-5 不适用于本模型)
  lr_scheduler_type: cosine
  weight_decay: 0.01
  max_steps: 600          # ≈600×2×16=1.9万条样本, 对齐 qwen 会话节奏; 视 CER 再 --resume 加练
  warmup_steps: 0.1       # 比例
  logging_steps: 10
  save_steps: 100
  save_total_limit: 2
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 16
  max_grad_norm: 1.0
  grad_norm_skip: 100     # 熔断阈值(移植自 qwen 会话踩坑结论)
  seed: 1883
