# E1: 对标 qwen-asr v1(整 epoch 20000步/GPU)——Nano 整 epoch ≈19200 步(612703/32)
name: "henan-aishell-e1"
output_dir: "outputs/lora-nano"

model_config:
  base_dir: "weights/fun-asr-nano-mlx/fp16"

data_config:
  data_file: "/Users/Apple/datasets/asr-mix/train/metadata.jsonl"

lora_config:
  r: 16
  lora_alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "v_proj"]

training_args:
  learning_rate: 1.0e-4
  lr_scheduler_type: cosine
  weight_decay: 0.01
  max_steps: 19200          # ≈1.0 epoch(每步 32 样本 × 19200 ≈ 61.4 万条)
  warmup_steps: 200
  logging_steps: 50
  save_steps: 1000
  save_total_limit: 25      # 19 个 ckpt × 20MB ≈ 380MB, 全留供 CER-vs-步数 曲线
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 16
  max_grad_norm: 1.0
  grad_norm_skip: 100
  seed: 1883
